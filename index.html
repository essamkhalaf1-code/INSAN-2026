<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رحلة الأخصائي | إنسان</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f6fa;--card:#fff;--tx:#17233a;--mut:#64748b;--ln:#e2e8f0;--navy:#183153;--teal:#127e7e;--gold:#e3b75e;--red:#e5686a;--blue:#5ba3e0;--green:#44b87a;--sa:#006c35;--sh:0 6px 18px rgba(18,43,70,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1e33;--card:#17304d;--tx:#eaf1f8;--mut:#9fb2c6;--ln:#2a4565}}
:root[data-theme="dark"]{--bg:#0e1e33;--card:#17304d;--tx:#eaf1f8;--mut:#9fb2c6;--ln:#2a4565}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,"Segoe UI",Tahoma,sans-serif;min-height:100dvh}
.app{max-width:480px;margin:auto;padding:14px 14px 28px;min-height:100dvh}
button{font-family:inherit;cursor:pointer;border:0}
.hero{background:linear-gradient(135deg,#183153,#127e7e);color:#fff;border-radius:24px;padding:16px;display:flex;gap:14px;align-items:center;box-shadow:var(--sh)}
.hero h1{margin:0;font-size:20px;font-weight:800}.hero p{margin:2px 0 8px;opacity:.85;font-size:13px}
.xp{background:rgba(255,255,255,.18);border-radius:99px;padding:3px 12px;font-weight:700;font-size:13px;display:inline-block;margin-inline-end:6px}
.shr{background:var(--gold);color:#17233a;border-radius:99px;padding:3px 12px;font-weight:800;font-size:13px}
.ring{width:84px;height:84px;flex:none;position:relative}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:20px}
.tip{background:var(--card);border-radius:18px;padding:12px 14px;margin-top:12px;box-shadow:var(--sh);border-inline-start:6px solid var(--sa);font-size:14px;line-height:1.7}
.tip small{display:block;color:var(--mut);margin-top:4px}.tip .pg{margin-top:6px}
h3{margin:18px 4px 8px;font-size:15px}
.map{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lv{background:var(--card);border-radius:20px;padding:14px 10px;text-align:center;box-shadow:var(--sh);color:var(--tx);border-bottom:5px solid var(--c);transition:transform .15s}
.lv:active{transform:scale(.96)}.lv .ic{font-size:40px;display:block;animation:fl 3s ease-in-out infinite}
.lv b{display:block;font-size:15px;margin-top:4px}.lv small{color:var(--mut);font-size:12px}.lv .st{display:block;margin-top:4px;font-size:15px;letter-spacing:2px;min-height:22px}
.lv.nx{outline:3px solid var(--gold)}
@keyframes fl{50%{transform:translateY(-4px)}}
.radar{background:var(--card);border-radius:22px;padding:8px;box-shadow:var(--sh);text-align:center}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.bk{background:var(--card);color:var(--tx);width:38px;height:38px;border-radius:12px;font-size:22px;box-shadow:var(--sh)}
.pg{flex:1;height:10px;background:var(--ln);border-radius:9px;overflow:hidden}.pg i{display:block;height:100%;background:linear-gradient(90deg,var(--sa),var(--gold));border-radius:9px;transition:width .4s}
.sc{font-size:14px;background:var(--card);padding:6px 12px;border-radius:99px;box-shadow:var(--sh)}
.qh{background:var(--card);border-radius:22px;padding:22px 14px 18px;box-shadow:var(--sh);text-align:center;position:relative;min-height:170px;display:grid;align-content:center}
.qh .big{font-size:56px;line-height:1.1}.qh h2{margin:8px 0 0;font-size:19px;line-height:1.6}
.rt{position:absolute;top:10px;left:10px;width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.25);color:#17233a}
.rt svg{position:absolute;inset:0;transform:rotate(-90deg)}.rt b{font-size:22px;font-weight:800;position:relative}
.rb{fill:none;stroke:#dde6ee;stroke-width:5}.rg{fill:none;stroke:var(--sa);stroke-width:5;stroke-linecap:round;stroke-dasharray:138.2;animation:rg var(--d) linear forwards}
@keyframes rg{to{stroke-dashoffset:138.2}}.rt.low .rg{stroke:var(--red)}.rt.low b{color:var(--red);animation:pu .5s infinite alternate}@keyframes pu{to{transform:scale(1.25)}}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.a{color:#fff;border-radius:16px;padding:14px 8px;font-size:15px;font-weight:700;min-height:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 5px 0 rgba(0,0,0,.2);line-height:1.4}
.a:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.2)}.a i{font-style:normal;font-size:18px;opacity:.9}
.a0{background:var(--red)}.a1{background:var(--blue)}.a2{background:var(--gold);color:#17233a}.a3{background:var(--green)}
.ans:has(.a2):not(:has(.a3)) .a2{grid-column:1/-1}
.slots{display:flex;gap:6px;justify-content:center;margin:12px 0}
.sl{flex:1;min-height:74px;border:2px dashed var(--ln);border-radius:14px;display:grid;place-items:center;text-align:center;font-size:24px;color:var(--mut)}
.sl.on{border:2px solid var(--green);background:rgba(68,184,122,.15);color:var(--tx);animation:pop .3s}.sl small{font-size:11px;display:block;font-weight:700}
@keyframes pop{from{transform:scale(.7)}}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.chip{background:var(--card);color:var(--tx);border-radius:14px;padding:12px 14px;font-size:15px;font-weight:700;box-shadow:var(--sh);border-bottom:4px solid var(--sa)}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(8px)}75%{transform:translateX(-8px)}}
.chart{width:100%;background:var(--card);border-radius:22px;box-shadow:var(--sh);margin-top:12px}
.num{font-size:46px;font-weight:800;text-align:center;margin:6px 0 0}
input[type=range]{width:100%;height:36px;accent-color:var(--sa)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.fc{background:var(--card);color:var(--tx);border-radius:16px;padding:14px 6px;font-size:14px;font-weight:700;box-shadow:var(--sh);border:3px solid transparent;line-height:1.5}
.fc span{font-size:30px;display:block}.fc.sel{border-color:var(--sa);background:rgba(0,108,53,.14)}
.go{display:block;width:100%;margin-top:14px;background:var(--navy);color:#fff;border-radius:16px;padding:15px;font-size:16px;font-weight:800;box-shadow:0 5px 0 rgba(0,0,0,.25)}
#fb{position:fixed;inset:auto 0 0 0;z-index:20}
.sheet{max-width:480px;margin:auto;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));text-align:center;color:#fff;animation:up .25s}
.sheet.g{background:#2b9d63}.sheet.b{background:#d4504f}.sheet .big{font-size:40px}.sheet p{margin:4px 0 12px;font-size:15px;line-height:1.7}
.sheet button{background:#fff;color:#17233a;border-radius:14px;padding:12px 34px;font-weight:800;font-size:15px}
@keyframes up{from{transform:translateY(100%)}}
.end{text-align:center;padding-top:20px}.end .bg{font-size:76px}.stars{font-size:44px;letter-spacing:6px}
.pts{display:inline-block;background:var(--card);border-radius:18px;padding:10px 26px;box-shadow:var(--sh);margin:12px 0;font-size:22px;font-weight:800}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.two .go{margin:0}.go.alt{background:var(--sa)}
.brand{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.lgc{background:#fff;border-radius:16px;padding:6px 12px;box-shadow:var(--sh);display:grid;place-items:center}.li{height:58px;display:block}.ln{height:44px;max-width:54vw;display:block}
.team{display:block;width:100%;margin-top:12px;background:linear-gradient(135deg,var(--sa),var(--teal));color:#fff;border-radius:18px;padding:14px;font-size:17px;font-weight:800;box-shadow:var(--sh)}.team small{display:block;font-weight:400;opacity:.9;font-size:12px}
.tg{display:block;width:100%;text-align:center;margin-top:6px;background:linear-gradient(135deg,#0b2a4a,#006c35 60%,#127e7e);color:#fff;border-radius:24px;padding:20px 14px 18px;position:relative;overflow:hidden;box-shadow:0 10px 28px rgba(0,108,53,.4);border:2px solid rgba(227,183,94,.75);font-family:inherit}
.tg::before{content:"";position:absolute;width:190px;height:190px;border-radius:50%;background:rgba(227,183,94,.18);top:-80px;inset-inline-end:-50px}
.tg::after{content:"";position:absolute;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.08);bottom:-60px;inset-inline-start:-40px}
.tg>*{position:relative;z-index:1}.tg:active{transform:scale(.98)}
.live{position:absolute!important;top:12px;inset-inline-start:12px;background:#e5686a;border-radius:99px;padding:2px 11px;font-size:12px;font-weight:800;display:flex;gap:6px;align-items:center}.live i{width:8px;height:8px;border-radius:50%;background:#fff;animation:bl 1s infinite}@keyframes bl{50%{opacity:.2}}
.tgp{display:flex;justify-content:center;gap:10px;margin:10px 0 8px}.tgp span{width:54px;height:54px;border-radius:17px;background:rgba(255,255,255,.17);display:grid;place-items:center;font-size:29px;animation:fl 3s ease-in-out infinite;border:1px solid rgba(255,255,255,.25)}.tgp span:nth-child(2){animation-delay:.4s}.tgp span:nth-child(3){animation-delay:.8s}.tgp span:nth-child(4){animation-delay:1.2s}
.tg b{display:block;font-size:21px;font-weight:800}.tg small{display:block;opacity:.92;font-size:13px;margin:3px 0 14px}
.tg em{font-style:normal;display:inline-block;background:var(--gold);color:#17233a;border-radius:99px;padding:10px 28px;font-weight:800;font-size:15px;box-shadow:0 4px 0 rgba(0,0,0,.25);animation:pl 1.6s ease-in-out infinite}@keyframes pl{50%{transform:scale(1.07)}}
.opt{display:flex;flex-wrap:wrap;gap:8px}.o{background:var(--card);color:var(--tx);border-radius:14px;padding:10px 16px;font-size:16px;font-weight:800;box-shadow:var(--sh);border:3px solid transparent}.o.on{border-color:var(--sa);background:rgba(0,108,53,.14)}
.tn{display:flex;gap:8px;align-items:center;background:var(--card);border-radius:14px;padding:6px 10px;margin-bottom:8px;box-shadow:var(--sh);border-inline-start:6px solid var(--c)}.tn span{font-size:26px}.tn input{flex:1;border:0;background:transparent;color:var(--tx);font:inherit;font-weight:700;font-size:16px;outline:0;min-width:0}
.sb{display:flex;gap:6px;overflow:auto;margin-bottom:10px;padding:4px 2px}.sb b{flex:1;min-width:64px;background:var(--card);border-radius:12px;padding:6px 4px;text-align:center;font-size:12px;border-bottom:4px solid var(--c);box-shadow:var(--sh);line-height:1.5}.sb b.on{outline:3px solid var(--gold);transform:scale(1.05)}.sb span{display:block;font-size:20px}
.pass{text-align:center;padding:24px 10px}.pass .big{font-size:84px;line-height:1.1}.pass h2{margin:8px 0;font-size:26px}.pass p{color:var(--mut)}
.rowb{display:flex;align-items:center;gap:8px;margin:10px 0}.rowb i{height:32px;border-radius:10px;background:var(--c);flex:none}.rowb b{font-size:14px;min-width:96px;text-align:start}
.lv{position:relative}
.lv.lk{background-image:repeating-linear-gradient(135deg,transparent 0 10px,rgba(100,116,139,.07) 10px 20px)}.lv.lk .ic{filter:grayscale(.9);opacity:.5;animation:none}.lv.lk b{opacity:.8}
.lock{position:absolute;top:8px;inset-inline-start:8px;width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-style:normal;font-size:16px;box-shadow:0 3px 8px rgba(0,0,0,.3)}
.tg .lock{position:absolute!important;inset-inline-start:auto;inset-inline-end:10px;top:10px}
.note{margin:-4px 4px 10px;color:var(--mut);font-size:13px;line-height:1.7}
.pin{z-index:70;background:rgba(10,24,41,.78);backdrop-filter:blur(6px)}
.pb{background:var(--card);color:var(--tx);border-radius:28px;padding:22px 18px 18px;width:min(88vw,340px);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.45);border-top:6px solid var(--gold);animation:pi .3s}
@keyframes pi{from{transform:scale(.85);opacity:0}}
.pl{font-size:44px;display:inline-grid;place-items:center;width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--sa));box-shadow:0 8px 24px rgba(0,108,53,.35);margin-bottom:6px}
.pb h2{margin:4px 0;font-size:20px}.pb p{margin:0 0 8px;color:var(--mut);font-size:14px;line-height:1.7}.pb p b{color:var(--tx);font-size:16px}
.dots{display:flex;gap:12px;justify-content:center;margin:12px 0 6px}.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--mut);transition:.15s}.dots i.f{background:var(--sa);border-color:var(--sa);transform:scale(1.15)}
.pb.bad{animation:sh .4s}.pb.bad .dots i{border-color:var(--red);background:var(--red)}
.pm{min-height:22px;font-size:13px;color:var(--red);font-weight:700}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px;direction:ltr}.pad button{background:var(--bg);color:var(--tx);border-radius:16px;font-size:22px;font-weight:800;padding:13px 0;box-shadow:0 4px 0 rgba(0,0,0,.14)}.pad button:active{transform:translateY(3px);box-shadow:none}
.pb.ok .pl{background:linear-gradient(135deg,#2b9d63,#44b87a);animation:pop .4s}.pb.ok{border-top-color:var(--green)}
.cf{position:fixed;top:-30px;font-size:24px;animation:fa 1.7s ease-in forwards;z-index:50;pointer-events:none}
@keyframes fa{to{transform:translateY(110vh) rotate(360deg);opacity:.3}}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);display:grid;place-items:center;z-index:60}
.qrb{background:#fff;color:#17233a;border-radius:22px;padding:18px;text-align:center;width:min(86vw,340px)}.qrb svg{width:100%}.qrb small{color:#64748b}
</style>
</head>
